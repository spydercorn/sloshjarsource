; FilledJar separate-pass experiment (Skyrim SE/AE, known Jar03 pass only).
; Default OFF for safe installation. Enable LiquidOverlay AFTER a launch test.
[Visual]
Mode=Off

[RenderTrace]
Enabled=1
MaxMatches=12

; Replacement modes are off: keep vanilla/Open Shaders glass intact.
[RedPixelTest]
Enabled=0
[GravityPlaneTest]
Enabled=0

; Draws marked Jar03 a second time AFTER normal Skyrim glass.
; RTV0 RGB is blended 50% red where below gravity plane; RTV1/2 untouched.
; Depth writes disabled; original shader/state restored immediately afterward.
; EXPERIMENTAL: visual artifacts/instability possible with other graphics mods.
[LiquidOverlay]
Enabled=1

; v13: shake/tilt a jar to excite a slow spring, then it settles.
; No always-on looping motion. These values are read at Skyrim startup.
; Frequency is in radians/second: 1.05 ~= 6-second oscillation.
; Lower Damping = longer-lasting motion. MaxTiltDegrees is a safety clamp.
[MovementSlosh]
Enabled=1
Frequency=1.05
Damping=0.24
TranslationImpulse=0.0013
RotationImpulse=0.90
MaxTiltDegrees=16.0
